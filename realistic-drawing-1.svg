<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bgReal" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1f232b"/>
      <stop offset="50%" stop-color="#111317"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bgReal)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Hyper-Realistic Elder Portrait Lines & Texture -->
  <g transform="translate(400, 480)">
    <ellipse cx="0" cy="-30" rx="190" ry="240" fill="#14171d"/>
    <path d="M-80,-140 Q-30,-210 0,-210 Q30,-210 80,-140 Q130,-50 110,60 Q90,170 0,220 Q-90,170 -110,60 Q-130,-50 -80,-140 Z" fill="#1b1e26" stroke="#484d5c" stroke-width="2"/>

    <!-- Wisdom lines & detailed wrinkles -->
    <g stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.2" fill="none">
      <path d="M-60,-90 Q0,-105 60,-90"/>
      <path d="M-50,-75 Q0,-88 50,-75"/>
      <path d="M-65,-25 Q-40,-35 -15,-25"/>
      <path d="M15,-25 Q40,-35 65,-25"/>
      <!-- Crow's feet -->
      <path d="M-65,-30 L-85,-35"/>
      <path d="M-65,-25 L-88,-25"/>
      <path d="M-65,-20 L-85,-15"/>
      <path d="M65,-30 L85,-35"/>
      <path d="M65,-25 L88,-25"/>
      <path d="M65,-20 L85,-15"/>
      <!-- Laugh lines / Nasolabial folds -->
      <path d="M-25,25 Q-40,70 -30,110"/>
      <path d="M25,25 Q40,70 30,110"/>
    </g>

    <!-- Deep Intense Eyes -->
    <circle cx="-35" cy="-25" r="5" fill="#f3e5ab"/>
    <circle cx="35" cy="-25" r="5" fill="#f3e5ab"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 850)">
    <rect x="-180" y="-35" width="360" height="70" rx="35" fill="#12141a" fill-opacity="0.95" stroke="#d4af37" stroke-width="1.5"/>
    <text x="0" y="-8" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" fill="#f8f6f0" text-anchor="middle" font-weight="bold" letter-spacing="1.5">
      THE STOIC ELDER
    </text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#d4af37" text-anchor="middle" font-weight="600" letter-spacing="2">
      HYPER-REALISTIC CHARCOAL • A2
    </text>
  </g>

  <g transform="translate(400, 100)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#191b22" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#d4af37" text-anchor="middle" font-weight="600" letter-spacing="2.5">
      REALISTIC DRAWINGS
    </text>
  </g>
</svg>
