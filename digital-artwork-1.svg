<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bgDigi" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1c3d"/>
      <stop offset="40%" stop-color="#101124"/>
      <stop offset="100%" stop-color="#07080f"/>
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64dfdf"/>
      <stop offset="50%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgDigi)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#64dfdf" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Cosmic Digital Artwork Circles and Fluid Painterly Forms -->
  <g transform="translate(400, 480)">
    <circle cx="0" cy="-30" r="220" fill="url(#neonGlow)" opacity="0.2"/>
    <circle cx="0" cy="-30" r="170" fill="#121324" stroke="url(#neonGlow)" stroke-width="2"/>
    
    <!-- Ethereal Floating Figure -->
    <path d="M-60,-130 Q0,-180 60,-130 Q90,-20 0,160 Q-90,-20 -60,-130 Z" fill="#181a33" stroke="#64dfdf" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Luminous Digital Brushstrokes -->
    <path d="M-150,0 Q0,-80 150,0 Q80,120 -150,0 Z" fill="none" stroke="url(#neonGlow)" stroke-width="4" opacity="0.8"/>
    <circle cx="-20" cy="-40" r="5" fill="#64dfdf"/>
    <circle cx="20" cy="-40" r="5" fill="#f72585"/>
    <path d="M-10,20 Q0,30 10,20" stroke="#64dfdf" stroke-width="2" fill="none"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 850)">
    <rect x="-180" y="-35" width="360" height="70" rx="35" fill="#12141a" fill-opacity="0.95" stroke="#64dfdf" stroke-width="1.5"/>
    <text x="0" y="-8" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" fill="#f8f6f0" text-anchor="middle" font-weight="bold" letter-spacing="1.5">
      ASTRAL REVERIE
    </text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64dfdf" text-anchor="middle" font-weight="600" letter-spacing="2">
      PROCREATE DIGITAL MASTER • 600 DPI
    </text>
  </g>

  <g transform="translate(400, 100)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#191b22" stroke="#64dfdf" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64dfdf" text-anchor="middle" font-weight="600" letter-spacing="2.5">
      DIGITAL ARTWORK
    </text>
  </g>
</svg>
