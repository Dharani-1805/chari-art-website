<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bgPet" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2c2825"/>
      <stop offset="60%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#0a0a09"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bgPet)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Pet Dog Realism Portrait Outline -->
  <g transform="translate(400, 480)">
    <!-- Ears -->
    <path d="M-140,-120 Q-180,-40 -120,40 Q-80,20 -90,-80 Z" fill="#1f1c1a" stroke="#d4af37" stroke-opacity="0.3"/>
    <path d="M140,-120 Q180,-40 120,40 Q80,20 90,-80 Z" fill="#1f1c1a" stroke="#d4af37" stroke-opacity="0.3"/>
    
    <!-- Head & Muzzle -->
    <ellipse cx="0" cy="-40" rx="110" ry="120" fill="#25211e"/>
    <ellipse cx="0" cy="30" rx="65" ry="60" fill="#2e2925"/>
    
    <!-- Big expressive moist eyes -->
    <circle cx="-45" cy="-30" r="14" fill="#0d0c0a"/>
    <circle cx="-42" cy="-34" r="4.5" fill="#ffffff"/>
    <circle cx="45" cy="-30" r="14" fill="#0d0c0a"/>
    <circle cx="48" cy="-34" r="4.5" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M-22,30 Q0,20 22,30 Q0,55 -22,30 Z" fill="#0a0a09"/>
    <circle cx="-5" cy="36" r="1.5" fill="#ffffff" opacity="0.6"/>
    <!-- Whiskers -->
    <g stroke="#d4af37" stroke-opacity="0.5" stroke-width="1.2" fill="none">
      <path d="M-25,45 Q-70,50 -100,40"/>
      <path d="M-25,50 Q-70,60 -95,55"/>
      <path d="M25,45 Q70,50 100,40"/>
      <path d="M25,50 Q70,60 95,55"/>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 850)">
    <rect x="-180" y="-35" width="360" height="70" rx="35" fill="#12141a" fill-opacity="0.95" stroke="#d4af37" stroke-width="1.5"/>
    <text x="0" y="-8" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" fill="#f8f6f0" text-anchor="middle" font-weight="bold" letter-spacing="1.5">
      THE LOYAL COMPANION
    </text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#d4af37" text-anchor="middle" font-weight="600" letter-spacing="2">
      PET MEMORIAL REALISM • A4
    </text>
  </g>
</svg>
