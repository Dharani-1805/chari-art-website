<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bgColPencil" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#3d2a22"/>
      <stop offset="50%" stop-color="#1e1515"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </radialGradient>
    <linearGradient id="warmTones" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8a574"/>
      <stop offset="35%" stop-color="#e07a5f"/>
      <stop offset="70%" stop-color="#c94a29"/>
      <stop offset="100%" stop-color="#812814"/>
    </linearGradient>
    <linearGradient id="amberIris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d061"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#805b10"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgColPencil)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#e07a5f" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Colour Pencil Portrait Layering -->
  <g transform="translate(400, 470)">
    <!-- Warm Aura Bloom -->
    <ellipse cx="0" cy="-20" rx="210" ry="250" fill="#e07a5f" opacity="0.15"/>
    
    <!-- Face Shape with Multi-Tonal Blends -->
    <path d="M-85,-140 Q-30,-200 0,-200 Q30,-200 85,-140 Q135,-40 115,70 Q95,180 0,225 Q-95,180 -115,70 Q-135,-40 -85,-140 Z" fill="url(#warmTones)" opacity="0.9" stroke="#f3e5ab" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Luminous Cheeks & Highlights -->
    <ellipse cx="-45" cy="40" rx="35" ry="25" fill="#f8a574" opacity="0.6"/>
    <ellipse cx="45" cy="40" rx="35" ry="25" fill="#f8a574" opacity="0.6"/>

    <!-- Vivid Polychromos Colour Eyes -->
    <g transform="translate(0, -35)">
      <!-- Left Eye -->
      <path d="M-55,0 Q-35,-15 -15,0 Q-35,15 -55,0 Z" fill="#ffffff" opacity="0.95"/>
      <circle cx="-35" cy="0" r="12" fill="url(#amberIris)"/>
      <circle cx="-35" cy="0" r="6" fill="#12141a"/>
      <circle cx="-32" cy="-3" r="2.5" fill="#ffffff"/>
      <path d="M-58,-12 Q-35,-22 -12,-12" stroke="#5a2e1d" stroke-width="2.5" fill="none"/>

      <!-- Right Eye -->
      <path d="M15,0 Q35,-15 55,0 Q35,15 15,0 Z" fill="#ffffff" opacity="0.95"/>
      <circle cx="35" cy="0" r="12" fill="url(#amberIris)"/>
      <circle cx="35" cy="0" r="6" fill="#12141a"/>
      <circle cx="38" cy="-3" r="2.5" fill="#ffffff"/>
      <path d="M12,-12 Q35,-22 58,-12" stroke="#5a2e1d" stroke-width="2.5" fill="none"/>
    </g>

    <!-- Warm Lip Shading -->
    <path d="M-28,80 Q0,70 28,80 Q0,105 -28,80 Z" fill="#b03a2e" stroke="#f5b7b1" stroke-opacity="0.6" stroke-width="1"/>
    <path d="M-25,80 Q0,86 25,80" stroke="#f8a574" stroke-width="1.5" fill="none"/>

    <!-- Luscious Hair Strands in Polychromos Palette -->
    <g stroke="#d4af37" stroke-opacity="0.6" stroke-width="2" fill="none">
      <path d="M-85,-140 C-160,-80 -180,90 -120,240"/>
      <path d="M85,-140 C160,-80 180,90 120,240"/>
      <path d="M-40,-180 C0,-230 40,-180 60,-130" stroke="#e07a5f"/>
      <path d="M-100,-100 C-170,30 -160,180 -90,290" stroke="#f3e5ab" stroke-opacity="0.5"/>
      <path d="M100,-100 C170,30 160,180 90,290" stroke="#f3e5ab" stroke-opacity="0.5"/>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 850)">
    <rect x="-180" y="-35" width="360" height="70" rx="35" fill="#12141a" fill-opacity="0.95" stroke="#e07a5f" stroke-width="1.5"/>
    <text x="0" y="-8" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" fill="#f8f6f0" text-anchor="middle" font-weight="bold" letter-spacing="1.5">
      RADIANCE IN AMBER
    </text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#e07a5f" text-anchor="middle" font-weight="600" letter-spacing="2">
      POLYCHROMOS ON STONEHENGE • A3
    </text>
  </g>

  <g transform="translate(400, 100)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#191b22" stroke="#e07a5f" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#e07a5f" text-anchor="middle" font-weight="600" letter-spacing="2.5">
      COLOUR PENCIL MASTER
    </text>
  </g>
</svg>
