<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bgDigi2" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#231a38"/>
      <stop offset="50%" stop-color="#120e1e"/>
      <stop offset="100%" stop-color="#08060d"/>
    </radialGradient>
    <linearGradient id="bloomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e00"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgDigi2)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#ff007f" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Fluid Cyber Flower / Abstract Form -->
  <g transform="translate(400, 480)">
    <g transform="scale(1.2)">
      <!-- Petals radiating in golden / magenta glow -->
      <path d="M0,0 C-80,-150 80,-150 0,0 Z" fill="url(#bloomGrad)" opacity="0.8"/>
      <path d="M0,0 C150,-80 150,80 0,0 Z" fill="url(#bloomGrad)" opacity="0.8"/>
      <path d="M0,0 C80,150 -80,150 0,0 Z" fill="url(#bloomGrad)" opacity="0.8"/>
      <path d="M0,0 C-150,80 -150,-80 0,0 Z" fill="url(#bloomGrad)" opacity="0.8"/>
      <circle cx="0" cy="0" r="30" fill="#f3e5ab" stroke="#ff007f" stroke-width="3"/>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 850)">
    <rect x="-180" y="-35" width="360" height="70" rx="35" fill="#12141a" fill-opacity="0.95" stroke="#ff007f" stroke-width="1.5"/>
    <text x="0" y="-8" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" fill="#f8f6f0" text-anchor="middle" font-weight="bold" letter-spacing="1.5">
      CYBER BLOOM SYMPHONY
    </text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ff007f" text-anchor="middle" font-weight="600" letter-spacing="2">
      DIGITAL ARTWORK • 600 DPI
    </text>
  </g>
</svg>
