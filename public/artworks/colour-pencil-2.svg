<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bgCol2" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#36283b"/>
      <stop offset="50%" stop-color="#1e1724"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bgCol2)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#d4af37" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 4"/>

  <g transform="translate(400, 480)">
    <circle cx="0" cy="-40" r="170" fill="#2a1f33" opacity="0.7"/>
    <!-- Gentle Child Portrait Outline -->
    <circle cx="0" cy="-40" r="130" fill="#fce4d6" opacity="0.9"/>
    
    <!-- Bright innocent eyes -->
    <ellipse cx="-45" cy="-50" rx="14" ry="16" fill="#3d2314"/>
    <circle cx="-42" cy="-55" r="4.5" fill="#ffffff"/>
    <ellipse cx="45" cy="-50" rx="14" ry="16" fill="#3d2314"/>
    <circle cx="48" cy="-55" r="4.5" fill="#ffffff"/>

    <!-- Rosy cheeks -->
    <ellipse cx="-55" cy="-20" rx="28" ry="18" fill="#ffb4a2" opacity="0.8"/>
    <ellipse cx="55" cy="-20" rx="28" ry="18" fill="#ffb4a2" opacity="0.8"/>

    <!-- Joyful Smile -->
    <path d="M-25,15 Q0,38 25,15" stroke="#c85a5a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 850)">
    <rect x="-180" y="-35" width="360" height="70" rx="35" fill="#12141a" fill-opacity="0.95" stroke="#d4af37" stroke-width="1.5"/>
    <text x="0" y="-8" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" fill="#f8f6f0" text-anchor="middle" font-weight="bold" letter-spacing="1.5">
      INNOCENCE &amp; WONDER
    </text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#d4af37" text-anchor="middle" font-weight="600" letter-spacing="2">
      PRISMACOLOR PREMIER • A4
    </text>
  </g>
</svg>
