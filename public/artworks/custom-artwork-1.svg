<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bgCustom1" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a2533"/>
      <stop offset="60%" stop-color="#14121a"/>
      <stop offset="100%" stop-color="#09080d"/>
    </radialGradient>
    <linearGradient id="goldVintage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgCustom1)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Two figures side-by-side composite study -->
  <g transform="translate(400, 470)">
    <!-- Left Figure (Father / Husband) -->
    <g transform="translate(-110, 0)">
      <ellipse cx="0" cy="-60" rx="85" ry="110" fill="#1b1822"/>
      <path d="M-60,50 C-110,120 -150,210 -160,320 L60,320 C50,210 10,120 -60,50 Z" fill="#15131b" stroke="#363042" stroke-width="1.5"/>
      <path d="M-55,-60 Q-25,-90 0,-70 Q25,-90 55,-60 Q65,-10 0,60 Q-65,-10 -55,-60 Z" fill="#24202d" stroke="url(#goldVintage)" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="-20" cy="-30" r="4" fill="#f3e5ab"/>
      <circle cx="20" cy="-30" r="4" fill="#f3e5ab"/>
      <path d="M-15,25 Q0,35 15,25" stroke="#f3e5ab" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Right Figure (Mother / Wife) leaning warmly together -->
    <g transform="translate(100, 20)">
      <ellipse cx="0" cy="-60" rx="80" ry="105" fill="#1e1a26"/>
      <path d="M-50,45 C-10,120 40,210 50,300 L-150,300 C-140,210 -100,120 -50,45 Z" fill="#181520" stroke="#363042" stroke-width="1.5"/>
      <path d="M-50,-60 Q-20,-90 0,-70 Q20,-90 50,-60 Q60,-10 0,55 Q-60,-10 -50,-60 Z" fill="#272233" stroke="url(#goldVintage)" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="-18" cy="-30" r="4" fill="#f3e5ab"/>
      <circle cx="18" cy="-30" r="4" fill="#f3e5ab"/>
      <path d="M-15,22 Q0,35 15,22" stroke="#f3e5ab" stroke-width="1.5" fill="none"/>
      <!-- Soft flowing hair strands -->
      <path d="M50,-60 C90,0 95,120 70,220" stroke="url(#goldVintage)" stroke-width="2" fill="none" opacity="0.6"/>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 850)">
    <rect x="-180" y="-35" width="360" height="70" rx="35" fill="#12141a" fill-opacity="0.95" stroke="#d4af37" stroke-width="1.5"/>
    <text x="0" y="-8" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" fill="#f8f6f0" text-anchor="middle" font-weight="bold" letter-spacing="1.5">
      LIFETIME OF TOGETHERNESS
    </text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#d4af37" text-anchor="middle" font-weight="600" letter-spacing="2">
      COMPOSITE DOUBLE PORTRAIT • A3
    </text>
  </g>

  <g transform="translate(400, 100)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#191b22" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#d4af37" text-anchor="middle" font-weight="600" letter-spacing="2.5">
      CUSTOM ARTWORKS
    </text>
  </g>
</svg>
