<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bgPencil2" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#23252d"/>
      <stop offset="70%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgPencil2)"/>
  
  <!-- Outer guidelines -->
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#d4af37" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Chiaroscuro Side Profile Silhouette -->
  <g transform="translate(380, 480)">
    <circle cx="0" cy="-50" r="180" fill="#181a20" opacity="0.8"/>
    
    <!-- Profile Silhouette -->
    <path d="M-80,-190 C-10,-210 60,-170 80,-110 C90,-80 85,-40 95,-20 C105,0 135,10 135,30 C135,45 105,55 100,70 C95,95 125,120 115,140 C105,160 65,185 30,200 C-10,215 -50,210 -100,200 L-100,-190 Z" fill="#20222a" stroke="#d4af37" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Dramatic cross-hatching shade lines -->
    <g stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.4" fill="none">
      <path d="M-60,-120 L40,-60"/>
      <path d="M-70,-90 L50,-30"/>
      <path d="M-80,-60 L60,0"/>
      <path d="M-80,-30 L70,30"/>
      <path d="M-80,0 L60,60"/>
      <path d="M-70,30 L50,90"/>
      <path d="M-60,60 L40,120"/>
    </g>

    <!-- Detailed Eye, Nose & Beard/Wisps -->
    <circle cx="65" cy="-25" r="4" fill="#f3e5ab"/>
    <path d="M50,-35 Q65,-45 80,-35" stroke="#f3e5ab" stroke-width="2" fill="none"/>
    <path d="M40,140 Q10,230 -80,260" stroke="#f3e5ab" stroke-opacity="0.5" stroke-width="1.5" fill="none"/>
    <path d="M60,150 Q20,240 -60,280" stroke="#f3e5ab" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 850)">
    <rect x="-180" y="-35" width="360" height="70" rx="35" fill="#12141a" fill-opacity="0.95" stroke="#d4af37" stroke-width="1"/>
    <text x="0" y="-8" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" fill="#f8f6f0" text-anchor="middle" font-weight="bold" letter-spacing="1.5">
      CHIAROSCURO PROFILE
    </text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#d4af37" text-anchor="middle" font-weight="600" letter-spacing="2">
      GRAPHITE 9B & CHARCOAL • A3
    </text>
  </g>

  <g transform="translate(400, 100)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#191b22" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#d4af37" text-anchor="middle" font-weight="600" letter-spacing="2.5">
      CHARI CREATIONS
    </text>
  </g>
</svg>
